name: Deploy DigitalFormsSystem to Azure

on:
  push:
    branches:
      - master
      - decouple-api-blazor
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clean and Publish Project
        run: |
          dotnet clean DigitalFormsSystem.csproj
          dotnet publish DigitalFormsSystem.csproj -c Release -r win-x86 --self-contained false -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'digitalformssystem-asp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish