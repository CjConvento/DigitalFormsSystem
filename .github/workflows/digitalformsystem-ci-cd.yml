name: Deploy DigitalFormsSystem to Azure

on:
  push:
    branches:
      - master              # Nagti-trigger kapag may push sa master branch
      - decouple-api-blazor # Kasama rin ang decoupling branch (for testing)

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Gamit ang Windows runner (para sa IIS compatibility)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # .NET 8 framework

      - name: Clean and Publish Project (32-Bit Build)
        run: |
          dotnet clean
          dotnet publish DigitalFormsSystem/DigitalFormsSystem.csproj -c Release -r win-x86 --self-contained false -o ./publish

      - name: Deploy Compiled Core to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'digitalformssystem-asp'  # <-- Palitan ng iyong Azure App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish